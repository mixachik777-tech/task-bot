[project]
name = "task-bot"
version = "0.1.0"
description = "Telegram-бот для управления задачами редакции с AI-ассистентом"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "apscheduler>=3.10,<4.0",
    "google-genai>=0.3",
    "loguru>=0.7,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "dateparser>=1.2,<2.0",
    "pgvector>=0.3,<1.0",
    "matplotlib>=3.9,<3.10",
    "numpy>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
